<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Oasis Verification</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #050505;
            color: white;

            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
        }

        button {
            padding: 13px 25px;

            border: 2px solid white;
            border-radius: 8px;

            background: #151515;
            color: white;

            font-size: 17px;
            cursor: pointer;

            transition:
                background 0.15s,
                transform 0.1s,
                opacity 0.15s;
        }

        button:hover:not(:disabled) {
            background: #292929;
        }

        button:active:not(:disabled) {
            transform: scale(0.97);
        }

        button:disabled {
            background: #3a3a3a;
            color: #888888;

            border-color: #666666;

            cursor: not-allowed;
            opacity: 0.65;

            transform: none;
        }

        #keyTitle {
            display: none;

            margin-top: 24px;
            margin-bottom: 12px;

            font-size: 22px;
            font-weight: bold;
        }

        #codeArea {
            display: none;

            align-items: center;
            justify-content: center;

            gap: 10px;
        }

        #codePanel {
            min-width: 190px;
            padding: 14px 22px;

            border: 3px solid white;

            border-radius: 18px 5px 18px 5px;

            background: #101010;

            box-shadow:
                5px 5px 0 #555,
                -2px -2px 0 #222;

            transform: rotate(-1deg);
        }

        #generatedCode {
            display: block;

            color: white;
            font-size: 25px;
            font-weight: bold;
            letter-spacing: 3px;

            user-select: text;
            cursor: text;
        }

        #copyButton {
            min-width: 90px;
        }

        #copyStatus {
            min-height: 22px;
            margin-top: 14px;

            color: #7dff90;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <main class="container">

        <button
            id="downloadButton"
            type="button"
        >
            Download
        </button>

        <div id="keyTitle">
            Here is Your Key
        </div>

        <div id="codeArea">

            <div id="codePanel">
                <span id="generatedCode"></span>
            </div>

            <button
                id="copyButton"
                type="button"
            >
                Copy
            </button>

        </div>

        <div id="copyStatus"></div>

    </main>

    <script>
        const downloadButton =
            document.getElementById("downloadButton");

        const keyTitle =
            document.getElementById("keyTitle");

        const codeArea =
            document.getElementById("codeArea");

        const generatedCode =
            document.getElementById("generatedCode");

        const copyButton =
            document.getElementById("copyButton");

        const copyStatus =
            document.getElementById("copyStatus");


        /*
         * Characters that can easily be confused have been removed:
         *
         * 0, O, 1, I and L
         */
        const characters =
            "ABCDEFGHJKMNPQRSTUVWXYZ23456789";


        function getSecureRandomNumber(maximum) {
            const randomValues =
                new Uint32Array(1);

            window.crypto.getRandomValues(
                randomValues
            );

            return randomValues[0] % maximum;
        }


        function generateRandomCode() {
            /*
             * Generates a random length from 5 to 8.
             */
            const codeLength =
                5 + getSecureRandomNumber(4);

            let code = "";

            for (
                let index = 0;
                index < codeLength;
                index++
            ) {
                const characterIndex =
                    getSecureRandomNumber(
                        characters.length
                    );

                code +=
                    characters[characterIndex];
            }

            return code;
        }


        function showGeneratedKey(code) {
            generatedCode.textContent =
                code;

            keyTitle.style.display =
                "block";

            codeArea.style.display =
                "flex";

            copyStatus.textContent =
                "";

            downloadButton.disabled =
                true;

            downloadButton.textContent =
                "Downloaded";
        }


        /*
         * Restore the key after refreshing the page.
         *
         * sessionStorage is cleared when the tab/browser session closes.
         */
        const existingKey =
            sessionStorage.getItem(
                "oasisGeneratedKey"
            );

        if (existingKey) {
            showGeneratedKey(
                existingKey
            );
        }


        downloadButton.addEventListener(
            "click",
            function () {
                /*
                 * Prevent another key being created during
                 * the same browser session.
                 */
                if (
                    sessionStorage.getItem(
                        "oasisGeneratedKey"
                    )
                ) {
                    return;
                }

                const newCode =
                    generateRandomCode();

                sessionStorage.setItem(
                    "oasisGeneratedKey",
                    newCode
                );

                showGeneratedKey(
                    newCode
                );
            }
        );


        copyButton.addEventListener(
            "click",
            async function () {
                const code =
                    generatedCode.textContent;

                if (!code) {
                    return;
                }

                try {
                    await navigator.clipboard.writeText(
                        code
                    );

                    copyStatus.textContent =
                        "Key copied!";
                }
                catch {
                    /*
                     * Fallback if automatic clipboard access
                     * is unavailable.
                     */
                    const selection =
                        window.getSelection();

                    const range =
                        document.createRange();

                    range.selectNodeContents(
                        generatedCode
                    );

                    selection.removeAllRanges();
                    selection.addRange(range);

                    copyStatus.textContent =
                        "Key selected — press Ctrl+C.";
                }
            }
        );
    </script>
</body>
</html>
