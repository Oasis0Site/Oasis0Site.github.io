<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Oasis Verification</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #050505;
            color: white;

            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
            padding: 30px;
        }

        button {
            padding: 13px 25px;

            border: 2px solid white;
            border-radius: 8px;

            background: #151515;
            color: white;

            font-size: 17px;
            cursor: pointer;

            transition:
                background 0.15s,
                transform 0.1s,
                opacity 0.15s;
        }

        button:hover:not(:disabled) {
            background: #292929;
        }

        button:active:not(:disabled) {
            transform: scale(0.97);
        }

        button:disabled {
            background: #3a3a3a;
            color: #888888;

            border-color: #666666;

            cursor: not-allowed;
            opacity: 0.65;
        }

        #keyTitle {
            display: none;

            margin-top: 24px;
            margin-bottom: 12px;

            font-size: 22px;
            font-weight: bold;
        }

        #codeArea {
            display: none;

            align-items: center;
            justify-content: center;

            gap: 10px;
        }

        #codePanel {
            min-width: 270px;
            padding: 14px 22px;

            border: 3px solid white;

            border-radius:
                18px 5px 18px 5px;

            background: #101010;

            box-shadow:
                5px 5px 0 #555,
                -2px -2px 0 #222;

            transform: rotate(-1deg);
        }

        #generatedCode {
            display: block;

            color: white;
            font-size: 21px;
            font-weight: bold;
            letter-spacing: 2px;

            user-select: text;
            cursor: text;
        }

        #copyButton {
            min-width: 90px;
        }

        #statusText {
            min-height: 24px;
            margin-top: 15px;

            color: #7dff90;
            font-size: 14px;
        }

        @media (
            max-width: 520px
        ) {
            #codeArea {
                flex-direction: column;
            }

            #codePanel {
                min-width: 0;
                width: 100%;
            }

            #generatedCode {
                font-size: 16px;
                letter-spacing: 1px;
            }
        }
    </style>
</head>

<body>
    <main class="container">

        <button
            id="downloadButton"
            type="button"
        >
            Download
        </button>

        <div id="keyTitle">
            Here is Your Key
        </div>

        <div id="codeArea">

            <div id="codePanel">
                <span id="generatedCode"></span>
            </div>

            <button
                id="copyButton"
                type="button"
            >
                Copy
            </button>

        </div>

        <div id="statusText"></div>

    </main>

   <script>
    const API_BASE =
        "https://oasis-activation-api.jacobleonardthomas.workers.dev";

    const downloadButton =
        document.getElementById("downloadButton");

    const keyTitle =
        document.getElementById("keyTitle");

    const codeArea =
        document.getElementById("codeArea");

    const generatedCode =
        document.getElementById("generatedCode");

    const copyButton =
        document.getElementById("copyButton");

    const statusText =
        document.getElementById("statusText");

    /*
     * This name is different from the old browser-generated
     * key system, so an old fake key won't be restored.
     */
    const SESSION_KEY_NAME =
        "oasisActivationKeyV1";


    function showGeneratedKey(code)
    {
        generatedCode.textContent =
            code;

        keyTitle.style.display =
            "block";

        codeArea.style.display =
            "flex";

        downloadButton.disabled =
            true;

        downloadButton.textContent =
            "Downloaded";

        statusText.style.color =
            "#7dff90";

        statusText.textContent =
            "";
    }


    /*
     * Refreshing keeps the same key.
     * Closing the browser session lets the button reset later.
     */
    const existingKey =
        sessionStorage.getItem(
            SESSION_KEY_NAME
        );

    if (existingKey)
    {
        showGeneratedKey(existingKey);
    }


    downloadButton.addEventListener(
        "click",
        async function ()
        {
            if (
                sessionStorage.getItem(
                    SESSION_KEY_NAME
                )
            )
            {
                return;
            }

            downloadButton.disabled =
                true;

            downloadButton.textContent =
                "Preparing...";

            statusText.style.color =
                "#ffffff";

            statusText.textContent =
                "Generating your key...";

            try
            {
                const response =
                    await fetch(
                        API_BASE + "/create-key",
                        {
                            method: "POST"
                        }
                    );

                let data;

                try
                {
                    data =
                        await response.json();
                }
                catch
                {
                    throw new Error(
                        "The key server returned an unreadable response."
                    );
                }

                if (response.status === 429)
                {
                    throw new Error(
                        "A key was generated recently from this connection. Wait ten minutes and try again."
                    );
                }

                if (!response.ok)
                {
                    throw new Error(
                        data.error ||
                        "The key server rejected the request."
                    );
                }

                if (
                    !data.ok ||
                    typeof data.key !== "string" ||
                    data.key.length === 0
                )
                {
                    throw new Error(
                        "The key server did not return a key."
                    );
                }

                sessionStorage.setItem(
                    SESSION_KEY_NAME,
                    data.key
                );

                showGeneratedKey(
                    data.key
                );

                /*
                 * Later, put the finished launcher download here:
                 *
                 * window.location.href =
                 *     "YOUR-LAUNCHER-DOWNLOAD-LINK";
                 */
            }
            catch (error)
            {
                downloadButton.disabled =
                    false;

                downloadButton.textContent =
                    "Download";

                statusText.style.color =
                    "#ff6868";

                statusText.textContent =
                    error.message ||
                    "Something went wrong.";
            }
        }
    );


    copyButton.addEventListener(
        "click",
        async function ()
        {
            const code =
                generatedCode.textContent;

            if (!code)
            {
                return;
            }

            try
            {
                await navigator.clipboard.writeText(
                    code
                );

                statusText.style.color =
                    "#7dff90";

                statusText.textContent =
                    "Key copied!";
            }
            catch
            {
                const selection =
                    window.getSelection();

                const range =
                    document.createRange();

                range.selectNodeContents(
                    generatedCode
                );

                selection.removeAllRanges();
                selection.addRange(range);

                statusText.style.color =
                    "#7dff90";

                statusText.textContent =
                    "Key selected — press Ctrl+C.";
            }
        }
    );
</script>
</body>
</html>
